  - name: baseline-merge
    sku: 80G1-A100
    sla_tier: standard
    priority: high
    submit_args:
      env:
        _AZUREML_SINGULARITY_JOB_UAI: UAMI-CS-NewsAndFeeds-Singularity
    command: |
      set -euo pipefail
      OUTPUT_ROOT=/mnt/blob_output/v-yukunban/news_image_crop_baselines/qwen3_5_9b_zero_shot_distributed_20260805
      DEADLINE=$$((SECONDS + 86400))
      for SHARD_INDEX in 0 1 2 3 4 5 6 7; do
        until test -f "$$OUTPUT_ROOT/shard-$$SHARD_INDEX/_SHARD_COMPLETE.json"; do
          if (( SECONDS >= DEADLINE )); then echo "Timed out waiting for shard $$SHARD_INDEX" >&2; exit 1; fi
          sleep 60
        done
      done
      .venv-qwen35/bin/python projects/news_image_crop_benchmark/scripts/merge_baseline_shards.py --data /mnt/blob_output/v-yukunban/news_image_crop_content_split/news_image_crop_test.parquet --shard-root "$$OUTPUT_ROOT" --shard-count 8 --output-dir "$$OUTPUT_ROOT/final" --run-id qwen35-fulltest-20260805-v1
