# yaml-language-server: $schema=file:///C:/Users/v-yukunban/Desktop/code/verl-Crop/.vscode/amlt-config.schema.json
description: Distributed full-test frozen Qwen3.5-9B crop baseline with proxy scoring

target:
  service: manifold
  name: Recall
  workspace_name: CS-NewsAndFeeds-Singularity

storage:
  blob_output:
    storage_account_name: csnewsandfeeds4150361735
    container_name: unium
    mount_dir: /mnt/blob_output
    is_output: true

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python -m pip install uv
    - uv python install 3.12
    - uv venv --seed --python 3.12 .venv-qwen35
    - uv pip install --python .venv-qwen35/bin/python "vllm==0.24.0"
    - uv pip install --python .venv-qwen35/bin/python -e .
    - uv pip install --python .venv-qwen35/bin/python -e "projects/news_image_crop_benchmark[data,train,test]"
    - uv pip uninstall --python .venv-qwen35/bin/python opencv-python
    - uv pip install --python .venv-qwen35/bin/python --reinstall opencv-python-headless

code:
  local_dir: $CONFIG_DIR/../..

jobs:
  - name: baseline-shard-0
    sku: 80G1-A100
    sla_tier: standard
    priority: high
    submit_args:
      env:
        _AZUREML_SINGULARITY_JOB_UAI: UAMI-CS-NewsAndFeeds-Singularity
    command: .venv-qwen35/bin/python projects/news_image_crop_benchmark/scripts/evaluate_vllm_baseline.py --model /mnt/blob_output/HuggingFace/Models/Qwen/Qwen3.5-9B --data /mnt/blob_output/v-yukunban/news_image_crop_content_split/news_image_crop_test.parquet --reward-file projects/news_image_crop_benchmark/rewards/crop_reward.py --clip-model-path /mnt/blob_output/HuggingFace/Models/clip-vit-large-patch14 --clip-device cuda --output-dir /mnt/blob_output/v-yukunban/news_image_crop_baselines/qwen3_5_9b_zero_shot_distributed_20260805/shard-0 --all-groups --n 8 --data-parallel-size 1 --tensor-parallel-size 1 --prompt-batch-size 32 --max-num-seqs 32 --shard-count 8 --shard-index 0 --run-id qwen35-fulltest-20260805-v1 --resume

  - name: baseline-shard-1
    sku: 80G1-A100
    sla_tier: standard
    priority: high
    submit_args:
      env:
        _AZUREML_SINGULARITY_JOB_UAI: UAMI-CS-NewsAndFeeds-Singularity
    command: .venv-qwen35/bin/python projects/news_image_crop_benchmark/scripts/evaluate_vllm_baseline.py --model /mnt/blob_output/HuggingFace/Models/Qwen/Qwen3.5-9B --data /mnt/blob_output/v-yukunban/news_image_crop_content_split/news_image_crop_test.parquet --reward-file projects/news_image_crop_benchmark/rewards/crop_reward.py --clip-model-path /mnt/blob_output/HuggingFace/Models/clip-vit-large-patch14 --clip-device cuda --output-dir /mnt/blob_output/v-yukunban/news_image_crop_baselines/qwen3_5_9b_zero_shot_distributed_20260805/shard-1 --all-groups --n 8 --data-parallel-size 1 --tensor-parallel-size 1 --prompt-batch-size 32 --max-num-seqs 32 --shard-count 8 --shard-index 1 --run-id qwen35-fulltest-20260805-v1 --resume

