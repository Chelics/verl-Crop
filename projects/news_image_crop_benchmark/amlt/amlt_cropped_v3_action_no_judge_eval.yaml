# yaml-language-server: $schema=file:///C:/Users/v-yukunban/Desktop/code/verl-Crop/.vscode/amlt-config.schema.json
# ^ Update with: amlt schema add <file>  |  VS Code: Run Task > amlt
# Amulet config file. Docs: https://amulet-docs.azurewebsites.net/config_file.html
# All required values are filled below.
description: Run strict action-v4 vLLM generation and rendering without a judge using the exported adapter

target:
  service: manifold  # run "amlt target list manifold" to see available targets
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity  # the Singularity workspace to submit to

storage:
  blob_output:
    storage_account_name: csnewsandfeeds4150361735
    container_name: unium
    mount_dir: /mnt/blob_output
    is_output: true

# REQUIRED: Docker environment
# Manifold jobs authenticate to Azure (storage, ACR) via a User-Assigned
# Managed Identity, auto-detected from the workspace in most cases. Only set
# _AZUREML_SINGULARITY_JOB_UAI in 'env' below if auto-detection is ambiguous
# (multiple non-primary identities); run 'amlt run' to see the available list.
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python -m pip install uv
    - uv python install 3.12
    - uv venv --seed --python 3.12 .venv-vllm
    - uv pip install --python .venv-vllm/bin/python "vllm==0.24.0" torchvision
    - uv pip install --python .venv-vllm/bin/python -e .
    - uv pip install --python .venv-vllm/bin/python -e "projects/news_image_crop_benchmark[data,test]"
    - uv pip uninstall --python .venv-vllm/bin/python opencv-python
    - uv pip install --python .venv-vllm/bin/python --reinstall opencv-python-headless
    - .venv-vllm/bin/python -c "import cv2, torch, torchvision, transformers, vllm; print('inference', cv2.__version__, torch.__version__, torchvision.__version__, transformers.__version__, vllm.__version__)"

# REQUIRED: code to run. Set local_dir to your code directory � it must
# exist and be non-empty. $CONFIG_DIR = directory of this file; the default
# $CONFIG_DIR/src means: put your code in a 'src' folder next to this file.
code:
  local_dir: $CONFIG_DIR/../../..

# REQUIRED: Jobs to run. SKU examples: C1 (1 CPU), G1 (1 GPU), G4 (4 GPUs), G8-V100 (8 V100s)
# Commands run from the uploaded code directory (code.local_dir).
# 'command' is a shell script block (|): one line per step, e.g. python train.py --lr 0.01
# Write outputs to $AMLT_OUTPUT_DIR for retrieval with 'amlt results'.
# Use $$VAR to pass env vars literally ($VAR is interpolated at submission time).
jobs:
  - name: cropped-v3-action-no-judge-eval
    sku: 80G1-A100
    sla_tier: standard
    priority: high
    submit_args:
      env:
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourcegroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
    command: |
      set -euo pipefail
      MODEL=/mnt/blob_output/HuggingFace/Models/Qwen/Qwen3.5-9B
      DATA=/mnt/blob_output/v-yukunban/crop-image-dataset/image_once_test.parquet
      PROMPT=projects/news_image_crop_benchmark/config/policy_prompts/v5_crop_fill_action.txt
      EXPORT_ROOT=/mnt/blob_output/v-yukunban/checkpoints/news_image_crop_fill_sft/exports/qwen35_cropped_v3_action_v4_step535
      ADAPTER=$$EXPORT_ROOT/lora_adapter
      PREFLIGHT_ID=qwen35-cropped-v3-action-v4-step535-no-judge-preflight-r3-20260818
      PREFLIGHT_OUTPUT=/mnt/blob_output/v-yukunban/crop-image-dataset/results/$$PREFLIGHT_ID
      FULL_ID=qwen35-cropped-v3-action-v4-step535-no-judge-full-r3-20260818
      FULL_OUTPUT=/mnt/blob_output/v-yukunban/crop-image-dataset/results/$$FULL_ID
      export PREFLIGHT_OUTPUT FULL_OUTPUT
      test -d "$$MODEL"
      test -f "$$DATA"
      test -f "$$PROMPT"
      test -s "$$ADAPTER/adapter_config.json"
      test -s "$$ADAPTER/adapter_model.safetensors"
      ADAPTER="$$ADAPTER" .venv-vllm/bin/python -c 'import json, os, pathlib; p=pathlib.Path(os.environ["ADAPTER"]); c=json.loads((p / "adapter_config.json").read_text()); assert c["r"] == 32 and c["lora_alpha"] == 64 and c["task_type"] == "CAUSAL_LM", c'
      .venv-vllm/bin/python projects/news_image_crop_benchmark/scripts/evaluate_crop_fill_action.py \
        --model "$$MODEL" \
        --lora-adapter-path "$$ADAPTER" \
        --lora-rank 32 \
        --data "$$DATA" \
        --prompt-template "$$PROMPT" \
        --output-dir "$$PREFLIGHT_OUTPUT" \
        --run-id "$$PREFLIGHT_ID" \
        --max-images 4 \
        --max-attempts 3 \
        --seed 42 \
        --temperature 0 \
        --top-p 1 \
        --max-model-len 4096 \
        --max-tokens 256 \
        --prompt-batch-size 4 \
        --max-num-seqs 4 \
        --resume
      .venv-vllm/bin/python -c 'import json, os, pathlib; p=pathlib.Path(os.environ["PREFLIGHT_OUTPUT"]); x=json.loads((p / "_NO_JUDGE_EVAL_COMPLETE.json").read_text()); assert x["tasks"] == 16, x'
      .venv-vllm/bin/python projects/news_image_crop_benchmark/scripts/evaluate_crop_fill_action.py \
        --model "$$MODEL" \
        --lora-adapter-path "$$ADAPTER" \
        --lora-rank 32 \
        --data "$$DATA" \
        --prompt-template "$$PROMPT" \
        --output-dir "$$FULL_OUTPUT" \
        --run-id "$$FULL_ID" \
        --max-attempts 3 \
        --seed 42 \
        --temperature 0 \
        --top-p 1 \
        --max-model-len 4096 \
        --max-tokens 256 \
        --prompt-batch-size 8 \
        --max-num-seqs 8 \
        --resume
      .venv-vllm/bin/python -c 'import json, os, pathlib; p=pathlib.Path(os.environ["FULL_OUTPUT"]); x=json.loads((p / "_NO_JUDGE_EVAL_COMPLETE.json").read_text()); assert x["tasks"] == 480, x'
      cp "$$PREFLIGHT_OUTPUT/summary.json" "$$AMLT_OUTPUT_DIR/preflight_summary.json"
      cp "$$FULL_OUTPUT/summary.json" "$$AMLT_OUTPUT_DIR/full_summary.json"
      printf '%s\n' "$$ADAPTER" > "$$AMLT_OUTPUT_DIR/adapter_path.txt"
      printf '%s\n' "$$FULL_OUTPUT" > "$$AMLT_OUTPUT_DIR/full_output_path.txt"

