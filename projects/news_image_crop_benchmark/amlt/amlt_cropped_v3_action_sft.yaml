# yaml-language-server: $schema=file:///C:/Users/v-yukunban/Desktop/code/verl-Crop/.vscode/amlt-config.schema.json
# ^ Update with: amlt schema add <file>  |  VS Code: Run Task > amlt
# Amulet config file. Docs: https://amulet-docs.azurewebsites.net/config_file.html
# All required values are filled below.
description: Train Qwen3.5-9B LoRA on five-field cropped_v3 crop/fill actions without description loss

target:
  service: manifold  # run "amlt target list manifold" to see available targets
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity  # the Singularity workspace to submit to

storage:
  blob_output:
    storage_account_name: csnewsandfeeds4150361735
    container_name: unium
    mount_dir: /mnt/blob_output
    is_output: true

# REQUIRED: Docker environment
# Manifold jobs authenticate to Azure (storage, ACR) via a User-Assigned
# Managed Identity, auto-detected from the workspace in most cases. Only set
# _AZUREML_SINGULARITY_JOB_UAI in 'env' below if auto-detection is ambiguous
# (multiple non-primary identities); run 'amlt run' to see the available list.
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python -m pip install uv
    - uv python install 3.12
    - uv venv --seed --python 3.12 .venv-qwen35
    - uv pip install --python .venv-qwen35/bin/python "torch==2.13.0" "torchvision==0.28.0" "transformers==5.10.4" -e .
    - uv pip install --python .venv-qwen35/bin/python -e "projects/news_image_crop_benchmark[data,train,test]"
    - .venv-qwen35/bin/python -c "import torch, torchvision, transformers; print(torch.__version__, torchvision.__version__, transformers.__version__)"
    - .venv-qwen35/bin/python -c "import verl.trainer.sft_trainer; print('sft-import-ok')"

# REQUIRED: code to run. Set local_dir to your code directory � it must
# exist and be non-empty. $CONFIG_DIR = directory of this file; the default
# $CONFIG_DIR/src means: put your code in a 'src' folder next to this file.
code:
  local_dir: $CONFIG_DIR/../../..

# REQUIRED: Jobs to run. SKU examples: C1 (1 CPU), G1 (1 GPU), G4 (4 GPUs), G8-V100 (8 V100s)
# Commands run from the uploaded code directory (code.local_dir).
# 'command' is a shell script block (|): one line per step, e.g. python train.py --lr 0.01
# Write outputs to $AMLT_OUTPUT_DIR for retrieval with 'amlt results'.
# Use $$VAR to pass env vars literally ($VAR is interpolated at submission time).
jobs:
  - name: cropped-v3-action-sft
    sku: 80G4-A100
    sla_tier: standard
    priority: high
    submit_args:
      env:
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourcegroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
    command: |
      set -euo pipefail
      DATA_ROOT=/mnt/blob_output/v-yukunban/crop-image-dataset/sft/cropped-v3-action-v4
      TRAIN_FILE=$$DATA_ROOT/train.parquet
      VAL_FILE=$$DATA_ROOT/validation.parquet
      MODEL=/mnt/blob_output/HuggingFace/Models/Qwen/Qwen3.5-9B
      PROMPT=projects/news_image_crop_benchmark/config/policy_prompts/v5_crop_fill_action.txt
      CHECKPOINT=/mnt/blob_output/v-yukunban/checkpoints/news_image_crop_fill_sft/qwen35_cropped_v3_action_v4_20260818
      test -f "$$TRAIN_FILE"
      test -f "$$VAL_FILE"
      test -d "$$MODEL"
      test -f "$$PROMPT"
      .venv-qwen35/bin/python projects/news_image_crop_benchmark/scripts/validate_crop_fill_action_sft.py \
        --data "$$TRAIN_FILE" \
        --model "$$MODEL" \
        --prompt-template "$$PROMPT" \
        --max-length 4096 \
        --max-samples 32 \
        --output "$$AMLT_OUTPUT_DIR/train_processor_validation.json"
      .venv-qwen35/bin/python projects/news_image_crop_benchmark/scripts/validate_crop_fill_action_sft.py \
        --data "$$VAL_FILE" \
        --model "$$MODEL" \
        --prompt-template "$$PROMPT" \
        --max-length 4096 \
        --max-samples 32 \
        --output "$$AMLT_OUTPUT_DIR/validation_processor_validation.json"
      PYTHON_BIN=.venv-qwen35/bin/python \
      PRINT_CONFIG=1 \
      MODEL_PATH="$$MODEL" \
      TRAIN_FILE="$$TRAIN_FILE" \
      VAL_FILE="$$VAL_FILE" \
      OUTPUT_DIR="$$CHECKPOINT" \
      EXPERIMENT_NAME=qwen35_cropped_v3_action_v4_20260818 \
      bash projects/news_image_crop_benchmark/run_qwen3_5_9b_crop_fill_sft.sh \
        > "$$AMLT_OUTPUT_DIR/resolved_config.yaml"
      PYTHON_BIN=.venv-qwen35/bin/python \
      MODEL_PATH="$$MODEL" \
      TRAIN_FILE="$$TRAIN_FILE" \
      VAL_FILE="$$VAL_FILE" \
      OUTPUT_DIR="$$CHECKPOINT" \
      EXPERIMENT_NAME=qwen35_cropped_v3_action_v4_20260818 \
      bash projects/news_image_crop_benchmark/run_qwen3_5_9b_crop_fill_sft.sh
      LATEST_CHECKPOINT=$$(find "$$CHECKPOINT" -maxdepth 1 -type d -name 'global_step_*' | sort -V | tail -n 1)
      test -n "$$LATEST_CHECKPOINT"
      printf '%s\n' "$$LATEST_CHECKPOINT" > "$$AMLT_OUTPUT_DIR/latest_checkpoint.txt"

