# yaml-language-server: $schema=file:///C:/Users/v-yukunban/Desktop/code/verl-Crop/.vscode/amlt-config.schema.json
description: Frozen InternVL2-8B four-ratio crop evaluation with GPT visual judge

target:
  service: manifold
  name: Recall
  workspace_name: CS-NewsAndFeeds-Singularity

storage:
  blob_output:
    storage_account_name: csnewsandfeeds4150361735
    container_name: unium
    mount_dir: /mnt/blob_output
    is_output: true

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python -m pip install uv
    - uv python install 3.12
    - uv venv --seed --python 3.12 .venv-internvl2
    - uv pip install --python .venv-internvl2/bin/python "vllm==0.24.0" torchvision einops
    - uv pip install --python .venv-internvl2/bin/python --reinstall "sentencepiece==0.2.0"
    - uv pip install --python .venv-internvl2/bin/python -e projects/news_image_crop_benchmark --no-deps
    - uv pip install --python .venv-internvl2/bin/python "Pillow>=10" "pyarrow>=19" pyyaml "openai>=2" "azure-identity>=1.17"

code:
  local_dir: $CONFIG_DIR

jobs:
  - name: internvl2-8b-preflight
    sku: 80G1-A100
    sla_tier: standard
    priority: high
    submit_args:
      env:
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
    command: |
      set -euo pipefail
      DATA_PATH=/mnt/blob_output/v-yukunban/crop-image-dataset/image_once_test.parquet
      MODEL_PATH=/mnt/blob_output/HuggingFace/Models/OpenGVLab/InternVL2-8B
      RUN_ID=internvl2-8b-four-ratios-vlm-preflight-crop-first-v2
      OUTPUT_DIR=/mnt/blob_output/v-yukunban/crop-image-dataset/results/$$RUN_ID
      test -f "$$DATA_PATH"
      test -d "$$MODEL_PATH"
      export CROP_VLM_LOG_PATH="$$OUTPUT_DIR/judge_responses.jsonl"
      export CROP_VLM_TIMEOUT=45
      export CROP_VLM_MAX_RETRIES=2
      export CROP_VLM_FALLBACK_LABEL=5.0
      export CROP_VLM_PARSE_FALLBACK_LABEL=2.5
      .venv-internvl2/bin/python projects/news_image_crop_benchmark/scripts/evaluate_image_once_vlm.py \
        --model "$$MODEL_PATH" \
        --model-family internvl2 \
        --model-name InternVL2-8B \
        --data "$$DATA_PATH" \
        --policy-prompt-path projects/news_image_crop_benchmark/config/policy_prompts/v2_crop_first.txt \
        --action-protocol percent-json-v1 \
        --vlm-prompt-path projects/news_image_crop_benchmark/config/crop_vlm_prompt.txt \
        --output-dir "$$OUTPUT_DIR" \
        --max-images 4 \
        --max-attempts 10 \
        --seed 42 \
        --temperature 0.7 \
        --top-p 0.95 \
        --internvl-max-dynamic-patch 4 \
        --data-parallel-size 1 \
        --tensor-parallel-size 1 \
        --prompt-batch-size 4 \
        --max-num-seqs 4 \
        --judge-workers 1 \
        --run-id "$$RUN_ID" \
        --resume
      .venv-internvl2/bin/python projects/news_image_crop_benchmark/scripts/check_eval_gate.py \
        --summary "$$OUTPUT_DIR/summary.json" \
        --expected-tasks 16
      printf '%s\n' "$$OUTPUT_DIR" > "$$AMLT_OUTPUT_DIR/result_path.txt"
      cp "$$OUTPUT_DIR/summary.json" "$$AMLT_OUTPUT_DIR/summary.json"
      cp "$$OUTPUT_DIR/report.md" "$$AMLT_OUTPUT_DIR/report.md"
      cp "$$OUTPUT_DIR/_EVAL_COMPLETE.json" "$$AMLT_OUTPUT_DIR/_EVAL_COMPLETE.json"

  - name: internvl2-8b-full
    sku: 80G8-A100
    sla_tier: standard
    priority: high
    submit_args:
      env:
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
    command: |
      set -euo pipefail
      DATA_PATH=/mnt/blob_output/v-yukunban/crop-image-dataset/image_once_test.parquet
      MODEL_PATH=/mnt/blob_output/HuggingFace/Models/OpenGVLab/InternVL2-8B
      RUN_ID=internvl2-8b-four-ratios-vlm-full-crop-first-v2
      OUTPUT_DIR=/mnt/blob_output/v-yukunban/crop-image-dataset/results/$$RUN_ID
      test -f "$$DATA_PATH"
      test -d "$$MODEL_PATH"
      export CROP_VLM_LOG_PATH="$$OUTPUT_DIR/judge_responses.jsonl"
      export CROP_VLM_TIMEOUT=45
      export CROP_VLM_MAX_RETRIES=2
      export CROP_VLM_FALLBACK_LABEL=5.0
      export CROP_VLM_PARSE_FALLBACK_LABEL=2.5
      .venv-internvl2/bin/python projects/news_image_crop_benchmark/scripts/evaluate_image_once_vlm.py \
        --model "$$MODEL_PATH" \
        --model-family internvl2 \
        --model-name InternVL2-8B \
        --data "$$DATA_PATH" \
        --policy-prompt-path projects/news_image_crop_benchmark/config/policy_prompts/v2_crop_first.txt \
        --action-protocol percent-json-v1 \
        --vlm-prompt-path projects/news_image_crop_benchmark/config/crop_vlm_prompt.txt \
        --output-dir "$$OUTPUT_DIR" \
        --max-attempts 10 \
        --seed 42 \
        --temperature 0.7 \
        --top-p 0.95 \
        --internvl-max-dynamic-patch 4 \
        --data-parallel-size 8 \
        --tensor-parallel-size 1 \
        --prompt-batch-size 8 \
        --max-num-seqs 8 \
        --judge-workers 2 \
        --run-id "$$RUN_ID" \
        --resume
      .venv-internvl2/bin/python projects/news_image_crop_benchmark/scripts/check_eval_gate.py \
        --summary "$$OUTPUT_DIR/summary.json" \
        --expected-tasks 480
      printf '%s\n' "$$OUTPUT_DIR" > "$$AMLT_OUTPUT_DIR/result_path.txt"
      cp "$$OUTPUT_DIR/summary.json" "$$AMLT_OUTPUT_DIR/summary.json"
      cp "$$OUTPUT_DIR/summary.csv" "$$AMLT_OUTPUT_DIR/summary.csv"
      cp "$$OUTPUT_DIR/report.md" "$$AMLT_OUTPUT_DIR/report.md"
      cp "$$OUTPUT_DIR/_EVAL_COMPLETE.json" "$$AMLT_OUTPUT_DIR/_EVAL_COMPLETE.json"