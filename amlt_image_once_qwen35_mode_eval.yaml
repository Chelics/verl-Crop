# yaml-language-server: $schema=file:///C:/Users/v-yukunban/Desktop/code/verl-Crop/.vscode/amlt-config.schema.json
# ^ Update with: amlt schema add <file>  |  VS Code: Run Task > amlt
# Amulet config file. Docs: https://amulet-docs.azurewebsites.net/config_file.html
description: Frozen Qwen3.5-9B four-ratio crop-or-pad mode diagnosis without rendering or judging

target:
  service: manifold  # run "amlt target list manifold" to see available targets
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity  # the Singularity workspace to submit to

storage:
  blob_output:
    storage_account_name: csnewsandfeeds4150361735
    container_name: unium
    mount_dir: /mnt/blob_output
    is_output: true

# REQUIRED: Docker environment
# Manifold jobs authenticate to Azure (storage, ACR) via a User-Assigned
# Managed Identity, auto-detected from the workspace in most cases. Only set
# _AZUREML_SINGULARITY_JOB_UAI in 'env' below if auto-detection is ambiguous
# (multiple non-primary identities); run 'amlt run' to see the available list.
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python -m pip install uv
    - uv python install 3.12
    - uv venv --seed --python 3.12 .venv-qwen35-mode
    - uv pip install --python .venv-qwen35-mode/bin/python "vllm==0.24.0"
    - uv pip install --python .venv-qwen35-mode/bin/python -e .
    - uv pip install --python .venv-qwen35-mode/bin/python -e "projects/news_image_crop_benchmark[data,train,test]" pyyaml
    - uv pip uninstall --python .venv-qwen35-mode/bin/python opencv-python
    - uv pip install --python .venv-qwen35-mode/bin/python --reinstall opencv-python-headless

# REQUIRED: code to run. Set local_dir to your code directory � it must
# exist and be non-empty. $CONFIG_DIR = directory of this file; the default
# $CONFIG_DIR/src means: put your code in a 'src' folder next to this file.
code:
  local_dir: $CONFIG_DIR

# REQUIRED: Jobs to run. SKU examples: C1 (1 CPU), G1 (1 GPU), G4 (4 GPUs), G8-V100 (8 V100s)
# Commands run from the uploaded code directory (code.local_dir).
# 'command' is a shell script block (|): one line per step, e.g. python train.py --lr 0.01
# Write outputs to $AMLT_OUTPUT_DIR for retrieval with 'amlt results'.
# Use $$VAR to pass env vars literally ($VAR is interpolated at submission time).
jobs:
  - name: qwen35-mode-only-full
    sku: 80G1-A100
    sla_tier: standard
    priority: high
    submit_args:
      env:
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourcegroups/RG-CS-NewsAndFeeds-Singularity/providers/Microsoft.ManagedIdentity/userAssignedIdentities/UAMI-CS-NewsAndFeeds-Singularity
    command: |
      set -euo pipefail
      DATA_PATH=/mnt/blob_output/v-yukunban/crop-image-dataset/image_once_test.parquet
      MODEL_PATH=/mnt/blob_output/HuggingFace/Models/Qwen/Qwen3.5-9B
      RUN_ID=qwen35-mode-only-v1-full-20260812
      export OUTPUT_DIR=/mnt/blob_output/v-yukunban/crop-image-dataset/results/$$RUN_ID
      test -f "$$DATA_PATH"
      test -d "$$MODEL_PATH"
      .venv-qwen35-mode/bin/python projects/news_image_crop_benchmark/scripts/evaluate_image_once_mode.py \
        --model "$$MODEL_PATH" \
        --model-family qwen35 \
        --model-name Qwen3.5-9B \
        --data "$$DATA_PATH" \
        --mode-prompt-path projects/news_image_crop_benchmark/config/mode_prompts/v1_mode_only.txt \
        --output-dir "$$OUTPUT_DIR" \
        --max-attempts 3 \
        --seed 42 \
        --temperature 0.0 \
        --top-p 1.0 \
        --data-parallel-size 1 \
        --tensor-parallel-size 1 \
        --prompt-batch-size 8 \
        --max-num-seqs 8 \
        --run-id "$$RUN_ID" \
        --resume
      .venv-qwen35-mode/bin/python -c 'import json, os, pathlib; p = pathlib.Path(os.environ["OUTPUT_DIR"]) / "_MODE_EVAL_COMPLETE.json"; x = json.loads(p.read_text()); assert x["images"] == 120 and x["tasks"] == 480, x'
      printf '%s\n' "$$OUTPUT_DIR" > "$$AMLT_OUTPUT_DIR/result_path.txt"
      cp "$$OUTPUT_DIR/summary.json" "$$AMLT_OUTPUT_DIR/summary.json"
      cp "$$OUTPUT_DIR/summary.csv" "$$AMLT_OUTPUT_DIR/summary.csv"
      cp "$$OUTPUT_DIR/report.md" "$$AMLT_OUTPUT_DIR/report.md"
      cp "$$OUTPUT_DIR/report.html" "$$AMLT_OUTPUT_DIR/report.html"
      cp "$$OUTPUT_DIR/review_template.csv" "$$AMLT_OUTPUT_DIR/review_template.csv"
      cp "$$OUTPUT_DIR/details.jsonl" "$$AMLT_OUTPUT_DIR/details.jsonl"
      cp "$$OUTPUT_DIR/_MODE_EVAL_COMPLETE.json" "$$AMLT_OUTPUT_DIR/_MODE_EVAL_COMPLETE.json"
      tar -czf "$$AMLT_OUTPUT_DIR/report_bundle.tar.gz" -C "$$OUTPUT_DIR" \
        report.html report.md review_template.csv summary.json summary.csv details.jsonl renders

